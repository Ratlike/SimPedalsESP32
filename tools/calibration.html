<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimPedals Calibration</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; max-width: 900px; margin: 0 auto; }
  h1 { margin-bottom: 16px; color: #fff; }
  .status { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #555; }
  .dot.connected { background: #4caf50; }
  .badge { padding: 2px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; }
  .badge.off { background: #333; color: #888; }
  .badge.on { background: #ff9800; color: #000; }
  button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-connect { background: #4caf50; color: #fff; }
  .btn-calib { background: #ff9800; color: #000; margin-right: 8px; }
  .btn-save { background: #2196f3; color: #fff; }
  .btn-freeze { background: #666; color: #fff; padding: 4px 10px; font-size: 12px; }
  .btn-set { background: #555; color: #fff; padding: 4px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #333; }
  th { color: #888; font-size: 13px; font-weight: 500; }
  .bar-cell { width: 200px; }
  .bar-bg { background: #333; border-radius: 3px; height: 16px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; background: #4caf50; border-radius: 3px; transition: width 0.1s; }
  input[type="number"] { width: 80px; background: #222; border: 1px solid #444; color: #e0e0e0; padding: 3px 6px; border-radius: 4px; font-size: 13px; }
  .controls { margin: 16px 0; }
  .pedal-controls { margin-top: 20px; }
  .pedal-controls h3 { margin-bottom: 10px; color: #ccc; }
  .pedal-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .pedal-row label { width: 100px; }
  section { margin-bottom: 24px; }
</style>
</head>
<body>

<h1>SimPedals Calibration</h1>

<div class="status">
  <button class="btn-connect" id="btnConnect">Connect</button>
  <span class="dot" id="statusDot"></span>
  <span id="statusText">Disconnected</span>
  <span class="badge off" id="calibBadge">Normal</span>
</div>

<section>
  <table>
    <thead>
      <tr><th>Pedal</th><th>Raw</th><th>Min</th><th>Max</th><th class="bar-cell">Position</th></tr>
    </thead>
    <tbody id="pedalTable">
      <tr><td>Brake</td><td id="raw0">-</td><td id="min0">-</td><td id="max0">-</td><td class="bar-cell"><div class="bar-bg"><div class="bar-fill" id="bar0"></div></div></td></tr>
      <tr><td>Accelerator</td><td id="raw1">-</td><td id="min1">-</td><td id="max1">-</td><td class="bar-cell"><div class="bar-bg"><div class="bar-fill" id="bar1"></div></div></td></tr>
      <tr><td>Clutch</td><td id="raw2">-</td><td id="min2">-</td><td id="max2">-</td><td class="bar-cell"><div class="bar-bg"><div class="bar-fill" id="bar2"></div></div></td></tr>
      <tr><td>Handbrake</td><td id="raw3">-</td><td id="min3">-</td><td id="max3">-</td><td class="bar-cell"><div class="bar-bg"><div class="bar-fill" id="bar3"></div></div></td></tr>
    </tbody>
  </table>
</section>

<section class="controls">
  <button class="btn-calib" id="btnEnterCalib" disabled>Enter Calibration</button>
  <button class="btn-save" id="btnExitCalib" disabled>Exit &amp; Save</button>
</section>

<section class="pedal-controls" id="calibControls" style="display:none">
  <h3>Per-Pedal Calibration</h3>
  <div id="pedalControlRows"></div>
</section>

<script>
const VENDOR_ID = 0x3035;
const PRODUCT_ID = 0x8217;
const GET_REPORT_ID = 0x04;
const SET_REPORT_ID = 0x05;

const CMD_ENTER_CALIB = 0x01;
const CMD_EXIT_CALIB  = 0x02;
const CMD_SET_MIN     = 0x03;
const CMD_SET_MAX     = 0x04;
const CMD_FREEZE_MIN  = 0x05;
const CMD_FREEZE_MAX  = 0x06;

const PEDAL_NAMES = ['Brake', 'Accelerator', 'Clutch', 'Handbrake'];

let device = null;
let pollTimer = null;

// Build per-pedal control rows
const pedalControlRows = document.getElementById('pedalControlRows');
for (let i = 0; i < 4; i++) {
  pedalControlRows.innerHTML += `
    <div style="margin-bottom: 12px; padding: 8px; background: #222; border-radius: 6px;">
      <strong>${PEDAL_NAMES[i]}</strong>
      <div class="pedal-row" style="margin-top:6px">
        <label>Min:</label>
        <input type="number" id="inputMin${i}" step="any">
        <button class="btn-set" onclick="setMinVal(${i})">Set</button>
        <button class="btn-freeze" onclick="freezeMin(${i})">Freeze Current</button>
      </div>
      <div class="pedal-row">
        <label>Max:</label>
        <input type="number" id="inputMax${i}" step="any">
        <button class="btn-set" onclick="setMaxVal(${i})">Set</button>
        <button class="btn-freeze" onclick="freezeMax(${i})">Freeze Current</button>
      </div>
    </div>`;
}

document.getElementById('btnConnect').addEventListener('click', async () => {
  try {
    const devices = await navigator.hid.requestDevice({
      filters: [{ vendorId: VENDOR_ID, productId: PRODUCT_ID }]
    });
    if (!devices.length) return;
    device = devices[0];
    if (!device.opened) await device.open();
    document.getElementById('statusDot').classList.add('connected');
    document.getElementById('statusText').textContent = 'Connected';
    document.getElementById('btnEnterCalib').disabled = false;
    document.getElementById('btnExitCalib').disabled = false;
    startPolling();
  } catch (e) {
    console.error('Connection failed:', e);
  }
});

document.getElementById('btnEnterCalib').addEventListener('click', () => sendCommand(CMD_ENTER_CALIB, 0, 0));
document.getElementById('btnExitCalib').addEventListener('click', () => sendCommand(CMD_EXIT_CALIB, 0, 0));

async function sendCommand(cmd, pedal, value) {
  if (!device || !device.opened) return;
  const buf = new ArrayBuffer(8);
  const view = new DataView(buf);
  view.setUint8(0, cmd);
  view.setUint8(1, pedal);
  view.setUint8(2, 0);
  view.setUint8(3, 0);
  view.setFloat32(4, value || 0, true);  // little-endian
  await device.sendFeatureReport(SET_REPORT_ID, buf);
}

async function setMinVal(pedal) {
  const val = parseFloat(document.getElementById(`inputMin${pedal}`).value);
  if (!isNaN(val)) await sendCommand(CMD_SET_MIN, pedal, val);
}

async function setMaxVal(pedal) {
  const val = parseFloat(document.getElementById(`inputMax${pedal}`).value);
  if (!isNaN(val)) await sendCommand(CMD_SET_MAX, pedal, val);
}

async function freezeMin(pedal) { await sendCommand(CMD_FREEZE_MIN, pedal, 0); }
async function freezeMax(pedal) { await sendCommand(CMD_FREEZE_MAX, pedal, 0); }

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollDevice, 100);
}

async function pollDevice() {
  if (!device || !device.opened) return;
  try {
    const report = await device.receiveFeatureReport(GET_REPORT_ID);
    const dv = new DataView(report.buffer);

    const calibMode = dv.getUint8(0);
    const badge = document.getElementById('calibBadge');
    if (calibMode) {
      badge.textContent = 'Calibrating';
      badge.className = 'badge on';
      document.getElementById('calibControls').style.display = '';
    } else {
      badge.textContent = 'Normal';
      badge.className = 'badge off';
      document.getElementById('calibControls').style.display = 'none';
    }

    for (let i = 0; i < 4; i++) {
      const raw = dv.getFloat32(2 + i * 4, true);
      const min = dv.getFloat32(18 + i * 4, true);
      const max = dv.getFloat32(34 + i * 4, true);

      document.getElementById(`raw${i}`).textContent = raw.toFixed(2);
      document.getElementById(`min${i}`).textContent = min.toFixed(2);
      document.getElementById(`max${i}`).textContent = max.toFixed(2);

      const span = max - min;
      const pct = span > 0.01 ? Math.max(0, Math.min(100, ((raw - min) / span) * 100)) : 0;
      document.getElementById(`bar${i}`).style.width = pct + '%';
    }
  } catch (e) {
    console.error('Poll error:', e);
  }
}

// Handle enter key on number inputs
document.querySelectorAll('input[type="number"]').forEach(input => {
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const id = input.id;
      const pedal = parseInt(id.slice(-1));
      if (id.startsWith('inputMin')) setMinVal(pedal);
      else if (id.startsWith('inputMax')) setMaxVal(pedal);
    }
  });
});
</script>
</body>
</html>
